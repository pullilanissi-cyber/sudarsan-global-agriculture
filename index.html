<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sudarsan's Global Agriculture Commodities Export</title>

<meta name="description"
content="Sudarsan's Global Agriculture Commodities Export - Premium agricultural commodities from India to global B2B buyers.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#071b14;
    color:#fff;
    line-height:1.6;
}

nav{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    background:rgba(5,22,16,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.1);
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:800;
    color:#e5c76b;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-size:14px;
}

nav a:hover{
    color:#e5c76b;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding:120px 7% 70px;
    background:
    linear-gradient(rgba(3,24,16,.65),rgba(3,24,16,.85)),
    url("hero.jpg") center/cover;
}

.hero-content{
    max-width:850px;
}

.tag{
    color:#e5c76b;
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:14px;
    font-weight:bold;
    margin-bottom:20px;
}

h1{
    font-size:clamp(42px,7vw,78px);
    line-height:1.05;
    margin-bottom:25px;
}

.hero p{
    max-width:680px;
    font-size:20px;
    color:#e5e9e6;
    margin-bottom:35px;
}

.btn{
    display:inline-block;
    padding:15px 28px;
    border-radius:30px;
    background:#d9bd61;
    color:#071b14;
    text-decoration:none;
    font-weight:bold;
    margin-right:10px;
}

.btn.dark{
    background:transparent;
    border:1px solid #d9bd61;
    color:#fff;
}

.features{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:#0d2a1f;
    border-top:1px solid rgba(255,255,255,.1);
    border-bottom:1px solid rgba(255,255,255,.1);
}

.feature{
    padding:30px 20px;
    text-align:center;
    border-right:1px solid rgba(255,255,255,.08);
}

.feature strong{
    display:block;
    color:#e5c76b;
    margin-bottom:5px;
}

section{
    padding:90px 7%;
}

.section-title{
    text-align:center;
    max-width:800px;
    margin:auto;
    margin-bottom:55px;
}

.section-title span{
    color:#e5c76b;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:13px;
    font-weight:bold;
}

.section-title h2{
    font-size:45px;
    margin:10px 0;
}

.section-title p{
    color:#b9c5bf;
}

.about{
    background:#092117;
}

.about
